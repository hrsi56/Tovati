<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9FC"/>
      <stop offset=".62" stop-color="#F9EEF3"/>
      <stop offset="1" stop-color="#F2DCE6"/>
    </linearGradient>
    <linearGradient id="phoneFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E242A"/>
      <stop offset="1" stop-color="#130F12"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#5E2A3D" flood-opacity=".18"/>
    </filter>
    <filter id="pillShadow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#77324D" flood-opacity=".11"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="59" y="50" width="208" height="454" rx="23"/>
    </clipPath>
  </defs>

  <rect width="1024" height="500" fill="url(#background)"/>
  <path d="M687-78c148 13 283 109 332 224 36 84 33 190-17 275-56 97-172 151-276 121-111-31-171-133-143-238 20-74 86-109 129-167 46-62 29-146-25-215Z" fill="#E9BFD0" fill-opacity=".30"/>
  <path d="M-74 388c91-82 213-116 331-89 92 21 160 80 206 160 15 25 25 51 31 78H-74Z" fill="#D8E7E4" fill-opacity=".55"/>
  <circle cx="910" cy="83" r="32" fill="#FFF" fill-opacity=".45"/>
  <circle cx="952" cy="122" r="12" fill="#C67695" fill-opacity=".24"/>

  <g transform="translate(15 -4) rotate(-4 165 260)" filter="url(#softShadow)">
    <rect x="38" y="22" width="250" height="525" rx="46" fill="url(#phoneFrame)"/>
    <rect x="50" y="36" width="226" height="493" rx="34" fill="#FFF8FA"/>
    <g clip-path="url(#screenClip)">
      <image x="59" y="50" width="208" height="462" preserveAspectRatio="xMidYMin slice" xlink:href="app-today-source.png"/>
    </g>
    <rect x="116" y="38" width="94" height="21" rx="11" fill="#20191D"/>
  </g>

  <g transform="translate(858 76)">
    <circle cx="0" cy="0" r="49" fill="#FFFFFF" fill-opacity=".58"/>
    <path fill="#9C4163" d="M0 31.8-8.8 23.8C-33.4 1.5-42.5-6.9-42.5-22c0-12.4 9.6-22 22-22C-13.5-44-6.8-40.7 0-33.2 6.8-40.7 13.5-44 20.5-44c12.4 0 22 9.6 22 22 0 15.1-9.1 23.5-33.7 45.8L0 31.8Z"/>
    <path fill="#FFF8FA" fill-opacity=".34" d="M-21.5-35.8c-7.9 0-14 6.2-14 14.1 0 6.9 3.5 12.2 12.4 21-5.5-10-6-20.7-.6-29a20.7 20.7 0 0 1 6.6-6.4c-1.5.1-3 .3-4.4.3Z"/>
  </g>

  <g fill="#321F29" font-family="Arial Hebrew, Arial, sans-serif" text-anchor="middle" direction="rtl">
    <text x="750" y="205" font-size="82" font-weight="700">טובתי</text>
    <text x="750" y="263" font-size="34" font-weight="400">מעקב פוריות, בשבילך</text>
  </g>

  <g filter="url(#pillShadow)">
    <rect x="557" y="316" width="383" height="62" rx="31" fill="#FFFFFF" fill-opacity=".78"/>
  </g>
  <text x="748" y="356" fill="#7D3652" font-family="Arial Hebrew, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" direction="rtl">פרטית  •  חינמית  •  ללא פרסומות</text>

  <g fill="#775563" font-family="Arial Hebrew, Arial, sans-serif" font-size="23" text-anchor="middle" direction="rtl">
    <text x="750" y="429">הנתונים נשארים רק אצלך.</text>
  </g>
